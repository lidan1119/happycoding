name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published Earth page
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGES_URL%/}/earth.html"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$page" -o "$RUNNER_TEMP/earth.html" &&
               grep -Fq 'id="earth-root"' "$RUNNER_TEMP/earth.html"; then
              printf 'Published Earth page: %s\n' "$page"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          printf 'Unable to verify the published Earth page: %s\n' "$page" >&2
          exit 1
